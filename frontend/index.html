<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A personal atlas of visualizations — physics, signals and systems, programming, circuits." />
    <title>Atlas</title>
    <script>
      // Set the theme before first paint so a returning dark-mode visitor
      // never sees a flash of the (light) default.
      (function () {
        var stored = localStorage.getItem('atlas-theme');
        document.documentElement.dataset.theme = stored === 'dark' ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
