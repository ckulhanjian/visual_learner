<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Achk — the art of visualization. Physics, signals and systems, programming, circuits." />
    <title>Achk</title>
    <script>
      // Set the theme before first paint so a returning light-mode visitor
      // never sees a flash of the (dark) default. Mirrors useTheme.ts's
      // readStoredTheme — an explicit stored 'light' wins over the default.
      (function () {
        var stored = localStorage.getItem('atlas-theme');
        document.documentElement.dataset.theme = stored === 'light' ? 'light' : 'dark';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
